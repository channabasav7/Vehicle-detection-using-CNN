# YOLO dataset configuration for Vehicle Type Detection and Classification
# Keep the dataset root anchored to the project root so the trainer resolves
# the imported Roboflow images correctly even when started from this folder.

path: .                            # project root
train: dataset/combined/images/train
val: dataset/combined/images/val
test: dataset/combined/images/test

# Number of classes
nc: 7

# Class names (index order matters -- must match your annotation label IDs)
names:
  0: auto
  1: bike
  2: bus
  3: car
  4: person
  5: tractor
  6: truck
